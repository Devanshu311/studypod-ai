services:
  # Cloud FastAPI Backend with WebSockets
  - type: web
    name: studypod-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studypod-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 14

databases:
  # Free 24/7 Cloud PostgreSQL Database
  - name: studypod-db
    region: oregon
    plan: free
    databaseName: studypod
    user: studypod_user
